<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Products | ShopEase</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><div class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><h1>Manage Products</h1><a class="btn btn-primary" href="/admin/products/new">Add Product</a></div>
<div class="table-responsive"><table class="table table-striped align-middle"><thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead>
<tbody><tr th:each="p : ${products}"><td th:text="${p.id}"></td><td th:text="${p.name}"></td><td th:text="${p.price}"></td><td th:text="${p.stock}"></td><td>
<a class="btn btn-sm btn-outline-primary" th:href="@{/admin/products/{id}/edit(id=${p.id})}">Edit</a>
<form class="d-inline" th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post"><button class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this product?')">Delete</button></form>
</td></tr></tbody></table></div><a href="/" class="btn btn-secondary">Back to shop</a></div></body></html>
