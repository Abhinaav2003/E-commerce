<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${formTitle} + ' | ShopEase'">Product Form</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><div class="container py-5" style="max-width:700px"><h1 class="mb-4" th:text="${formTitle}"></h1>
<form th:object="${product}" th:action="${product.id == null} ? @{/admin/products} : @{/admin/products/{id}(id=${product.id})}" method="post">
<div class="mb-3"><label class="form-label">Name</label><input class="form-control" th:field="*{name}" required><div class="text-danger" th:errors="*{name}"></div></div>
<div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" th:field="*{description}" rows="3"></textarea></div>
<div class="mb-3"><label class="form-label">Price</label><input class="form-control" type="number" min="0.01" step="0.01" th:field="*{price}" required><div class="text-danger" th:errors="*{price}"></div></div>
<div class="mb-3"><label class="form-label">Image URL</label><input class="form-control" type="url" th:field="*{imageUrl}"></div>
<div class="mb-3"><label class="form-label">Stock</label><input class="form-control" type="number" min="0" th:field="*{stock}" required><div class="text-danger" th:errors="*{stock}"></div></div>
<button class="btn btn-primary">Save Product</button> <a href="/admin/products" class="btn btn-secondary">Cancel</a></form></div></body></html>
