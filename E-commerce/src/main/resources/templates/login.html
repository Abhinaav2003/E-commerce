<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | ShopEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="auth-page"><div class="card auth-card shadow p-4"><h2 class="text-center mb-4">Welcome Back</h2>
<div class="alert alert-danger" th:if="${param.error}">Invalid email or password.</div>
<div class="alert alert-success" th:if="${param.registered}">Registration successful. Please log in.</div>
<div class="alert alert-success" th:if="${param.logout}">You have logged out.</div>
<form th:action="@{/login}" method="post"><label class="form-label">Email</label>
<input class="form-control mb-3" type="email" name="username" required autocomplete="email">
<label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required autocomplete="current-password">
<button class="btn btn-primary w-100">Login</button></form>
<p class="mt-3 text-center">New customer? <a href="/register">Create an account</a></p><a class="text-center" href="/">Back to shop</a></div></body></html>
