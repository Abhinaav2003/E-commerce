<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register | ShopEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="auth-page"><div class="card auth-card shadow p-4"><h2 class="text-center mb-4">Create Account</h2>
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<form th:action="@{/register}" method="post"><label class="form-label">Email</label>
<input class="form-control mb-3" type="email" name="email" required maxlength="254" autocomplete="email">
<label class="form-label">Password (minimum 8 characters)</label><input class="form-control mb-3" type="password" name="password" required minlength="8" autocomplete="new-password">
<button class="btn btn-primary w-100">Register</button></form><p class="mt-3 text-center">Already registered? <a href="/login">Login</a></p></div></body></html>
