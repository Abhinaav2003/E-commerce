spring.application.name=ecommerce
server.port=${PORT:8080}

# Database
# Local default: file-based H2 (no setup needed). In production set DB_URL, DB_USERNAME and
# Neon PostgreSQL - credentials configured in Render
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Thymeleaf
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Admin account, created on startup if missing and kept in sync with these values.
# Default login: password "Admin@12345" at /admin/login (email admin@cheetah.com).
# CHANGE THIS before deploying publicly by setting the ADMIN_PASSWORD environment variable.
app.admin.email=${ADMIN_EMAIL:admin@cheetah.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# Image uploads (stored in the database)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Behind Render's proxy: use the real client IP (needed for the admin login lockout)
server.forward-headers-strategy=framework