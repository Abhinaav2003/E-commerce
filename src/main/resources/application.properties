spring.application.name=ecommerce
server.port=${PORT:8080}

# Database
# Neon PostgreSQL - credentials configured in Render
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Thymeleaf
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Admin account, created on startup if missing.
# If ADMIN_PASSWORD is empty, a random password is generated and printed once in the log.
app.admin.email=${ADMIN_EMAIL:admin@cheetah.com}
app.admin.password=${ADMIN_PASSWORD:}

# Image uploads (stored in the database)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Behind Render's proxy: use the real client IP (needed for the admin login lockout)
server.forward-headers-strategy=framework