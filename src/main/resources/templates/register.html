<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | Simple Shop</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="auth-page">
<main class="auth-card">
    <div class="brand-mark">S</div><h1>Create customer account</h1>
    <p class="muted">Register to browse and order products.</p>
    <div class="alert" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{/register}" method="post">
        <label>Username</label><input type="text" name="username" minlength="3" maxlength="60" required th:value="${username}">
        <label>Password (at least 6 characters)</label><input type="password" name="password" minlength="6" required>
        <button class="btn primary full" type="submit">Create account</button>
    </form>
    <p class="muted center">Already registered? <a th:href="@{/login}">Login</a></p>
</main>
</body></html>
