<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage products | Cheetah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root {
  --ink: #17212b;
  --paper: #f5f7f8;
  --card: #fff;
  --line: #e3e8ec;
  --muted: #5d6b79;
  --brand: #0f766e;
  --brand-dark: #0b5c56;
  --accent: #ffb703;
  --danger: #b42318;
  --radius: 14px;
}
body {
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
main { flex: 1; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: var(--brand); }

/* Nav */
.site-nav { background: var(--ink); padding-block: .7rem; }
.site-nav .navbar-brand { color: #fff; font-weight: 800; font-size: 1.35rem; letter-spacing: -.02em; }
.site-nav .navbar-brand span { color: var(--accent); }
.site-nav .nav-link-lite { color: #d5dde4; text-decoration: none; font-weight: 500; font-size: .95rem; }
.site-nav .nav-link-lite:hover { color: #fff; }

.page-title { font-weight: 800; letter-spacing: -.02em; font-size: clamp(1.5rem, 4.5vw, 2rem); margin: 0; }
.count { color: var(--muted); font-weight: 500; font-size: 1rem; }

.btn { font-weight: 600; border-radius: 10px; }
.btn-primary { background: var(--brand); border-color: var(--brand); }
.btn-primary:hover, .btn-primary:focus { background: var(--brand-dark); border-color: var(--brand-dark); }
.btn-outline-primary { color: var(--brand); border-color: var(--brand); }
.btn-outline-primary:hover { background: var(--brand); border-color: var(--brand); }
.btn-outline-danger { color: var(--danger); border-color: var(--danger); }
.btn-outline-danger:hover { background: var(--danger); border-color: var(--danger); }

/* Product table (desktop) */
.panel {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden;
}
.ptable { width: 100%; border-collapse: collapse; margin: 0; }
.ptable th {
  text-align: left; font-size: .82rem; font-weight: 600; color: var(--muted);
  padding: .8rem 1rem; background: #f0f4f6; border-bottom: 1px solid var(--line);
}
.ptable td { padding: .8rem 1rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
.ptable tbody tr:last-child td { border-bottom: 0; }
.ptable tbody tr:hover { background: #fafcfc; }
.ptable .num { text-align: right; }
.thumb {
  width: 48px; height: 48px; border-radius: 10px; object-fit: cover;
  background: #e9eef1; display: block;
}
.pname { font-weight: 600; }
.pid { color: var(--muted); font-size: .8rem; }
.stock { display: inline-block; font-size: .8rem; font-weight: 700; padding: .25em .65em; border-radius: 999px; }
.stock.ok { background: #dcf3ef; color: #0b5c56; }
.stock.low { background: #fff1cc; color: #7a5200; }
.stock.out { background: #fde4e0; color: var(--danger); }
.row-actions { display: flex; gap: .5rem; justify-content: flex-end; }
.row-actions form { margin: 0; }

/* Phone: each row becomes a card */
@media (max-width: 767.98px) {
  .panel { background: transparent; border: 0; border-radius: 0; overflow: visible; }
  .ptable thead { display: none; }
  .ptable, .ptable tbody { display: block; }
  .ptable tbody tr {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    gap: .25rem .85rem;
    align-items: center;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: .9rem; margin-bottom: .75rem;
  }
  .ptable td { display: block; padding: 0; border: 0; }
  .ptable .c-img { grid-row: 1 / span 2; }
  .ptable .c-name { grid-column: 2 / 4; }
  .ptable .c-price { grid-column: 2; font-weight: 700; }
  .ptable .c-stock { grid-column: 3; text-align: right; }
  .ptable .c-actions { grid-column: 1 / -1; margin-top: .6rem; padding-top: .7rem; border-top: 1px solid var(--line); }
  .ptable .num { text-align: left; }
  .ptable .c-stock { text-align: right; }
  .row-actions { justify-content: stretch; }
  .row-actions > a, .row-actions > form { flex: 1; }
  .row-actions .btn { width: 100%; padding: .55rem; }
}

/* Empty state */
.empty-state {
  text-align: center; background: var(--card); border: 1px dashed #c8d1d8;
  border-radius: var(--radius); padding: 3rem 1.25rem;
}
.empty-state h2 { font-weight: 700; font-size: 1.3rem; }
.empty-state p { color: var(--muted); }

.site-footer { background: var(--ink); color: #b9c5d0; padding: 1.25rem 1rem; font-size: .9rem; text-align: center; }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="container d-flex align-items-center justify-content-between">
    <a class="navbar-brand" href="/">Chee<span>tah</span></a>
    <div class="d-flex gap-3">
      <a class="nav-link-lite" href="/orders">Orders</a>
      <a class="nav-link-lite" href="/">Shop</a>
    </div>
  </div>
</nav>

<main class="container py-4 py-md-5">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3 mb-md-4">
    <h1 class="page-title">Manage products
      <span class="count" th:unless="${#lists.isEmpty(products)}" th:text="'(' + ${#lists.size(products)} + ')'"></span>
    </h1>
    <a class="btn btn-primary" href="/admin/products/new">Add product</a>
  </div>

  <div class="empty-state" th:if="${#lists.isEmpty(products)}">
    <h2>No products yet</h2>
    <p>Add your first product to start selling.</p>
    <a class="btn btn-primary" href="/admin/products/new">Add product</a>
  </div>

  <div class="panel" th:unless="${#lists.isEmpty(products)}">
    <table class="ptable">
      <thead>
        <tr>
          <th style="width:72px">Image</th>
          <th>Name</th>
          <th class="num">Price</th>
          <th>Stock</th>
          <th class="num">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="p : ${products}">
          <td class="c-img">
            <img class="thumb" loading="lazy" th:src="${p.imageUrl}" alt="" onerror="this.style.visibility='hidden'">
          </td>
          <td class="c-name">
            <div class="pname" th:text="${p.name}">Product</div>
            <div class="pid">ID <span th:text="${p.id}">1</span></div>
          </td>
          <td class="c-price num">₹<span th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 2, 'POINT')}">0.00</span></td>
          <td class="c-stock">
            <span class="stock out" th:if="${p.stock == 0}">Out of stock</span>
            <span class="stock low" th:if="${p.stock > 0 and p.stock <= 5}" th:text="${p.stock} + ' left'">3 left</span>
            <span class="stock ok" th:if="${p.stock > 5}" th:text="${p.stock} + ' in stock'">20 in stock</span>
          </td>
          <td class="c-actions">
            <div class="row-actions">
              <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/products/{id}/edit(id=${p.id})}">Edit</a>
              <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post">
                <button class="btn btn-sm btn-outline-danger" type="submit"
                        onclick="return confirm('Delete this product? This cannot be undone.')">Delete</button>
              </form>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <a href="/" class="btn btn-outline-secondary mt-3">Back to shop</a>
</main>

<footer class="site-footer">Cheetah © 2026 — Online shopping made simple</footer>
</body>
</html>
