<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Cart | Cheetah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root {
  --ink: #17212b;
  --ink-2: #22303d;
  --paper: #f5f7f8;
  --card: #fff;
  --line: #e3e8ec;
  --muted: #5d6b79;
  --brand: #0f766e;
  --brand-dark: #0b5c56;
  --accent: #ffb703;
  --danger: #b42318;
  --radius: 14px;
}
body {
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
main { flex: 1; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: var(--brand); }

/* Nav */
.site-nav { background: var(--ink); padding-block: .7rem; }
.site-nav .navbar-brand { color: #fff; font-weight: 800; font-size: 1.35rem; letter-spacing: -.02em; }
.site-nav .navbar-brand span { color: var(--accent); }
.site-nav .nav-link-lite { color: #d5dde4; text-decoration: none; font-weight: 500; font-size: .95rem; }
.site-nav .nav-link-lite:hover { color: #fff; }

/* Buttons */
.btn { font-weight: 600; border-radius: 10px; }
.btn-primary { background: var(--brand); border-color: var(--brand); }
.btn-primary:hover, .btn-primary:focus { background: var(--brand-dark); border-color: var(--brand-dark); }
.btn-outline-primary { color: var(--brand); border-color: var(--brand); }
.btn-outline-primary:hover { background: var(--brand); border-color: var(--brand); }
.btn-link-danger { color: var(--danger); font-weight: 600; font-size: .9rem; text-decoration: none; padding: .25rem 0; }
.btn-link-danger:hover { text-decoration: underline; color: var(--danger); }

.page-title { font-weight: 800; letter-spacing: -.02em; font-size: clamp(1.5rem, 4.5vw, 2rem); }
.item-count { color: var(--muted); font-weight: 500; font-size: 1rem; }

/* Cart items */
.cart-item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1rem;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: .75rem 1rem;
  align-items: start;
}
.cart-item + .cart-item { margin-top: .85rem; }
.ci-name { font-weight: 700; font-size: 1.05rem; margin: 0 0 .15rem; line-height: 1.3; }
.ci-unit { color: var(--muted); font-size: .9rem; margin: 0; }
.ci-subtotal { font-weight: 800; font-size: 1.15rem; text-align: right; white-space: nowrap; }
.ci-subtotal small { display: block; font-weight: 500; color: var(--muted); font-size: .75rem; }
.ci-actions { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: .8rem; }
.qty-form { display: flex; gap: .5rem; align-items: center; }
.qty-form label { font-size: .85rem; color: var(--muted); font-weight: 500; }
.qty-form .form-control { width: 80px; font-size: 1rem; border-radius: 10px; padding: .45rem .6rem; text-align: center; }
.qty-form .form-control:focus { border-color: var(--brand); box-shadow: 0 0 0 .2rem rgba(15,118,110,.18); }

/* Summary */
.summary {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.25rem;
}
.summary h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 1rem; }
.summary .row-line { display: flex; justify-content: space-between; color: var(--muted); margin-bottom: .5rem; }
.summary .total-line { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; font-size: 1.4rem; border-top: 1px solid var(--line); padding-top: .9rem; margin: .9rem 0 1.1rem; }
@media (min-width: 992px) { .summary { position: sticky; top: 1rem; } }

/* Phone: pin checkout to the bottom of the screen */
@media (max-width: 991.98px) {
  .summary { margin-top: 1rem; }
  .summary-mobile-pad { padding-bottom: 1rem; }
}

/* Empty state */
.empty-state {
  text-align: center; background: var(--card); border: 1px dashed #c8d1d8;
  border-radius: var(--radius); padding: 3rem 1.25rem;
}
.empty-state h2 { font-weight: 700; font-size: 1.3rem; }
.empty-state p { color: var(--muted); }

.alert { border-radius: 10px; }
.site-footer { background: var(--ink); color: #b9c5d0; padding: 1.25rem 1rem; font-size: .9rem; text-align: center; }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="container d-flex align-items-center justify-content-between">
    <a class="navbar-brand" href="/">Chee<span>tah</span></a>
    <div class="d-flex gap-3">
      <a class="nav-link-lite" href="/orders">My orders</a>
      <a class="nav-link-lite" href="/">Shop</a>
    </div>
  </div>
</nav>

<main class="container py-4 py-md-5 summary-mobile-pad">
  <h1 class="page-title mb-3 mb-md-4">
    Your cart
    <span class="item-count" th:unless="${#lists.isEmpty(items)}" th:text="'(' + ${#lists.size(items)} + ' ' + (${#lists.size(items)} == 1 ? 'item' : 'items') + ')'"></span>
  </h1>

  <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>

  <div class="empty-state" th:if="${#lists.isEmpty(items)}">
    <h2>Your cart is empty</h2>
    <p>Add a few products and they’ll show up here.</p>
    <a class="btn btn-primary" href="/">Start shopping</a>
  </div>

  <div class="row g-4" th:unless="${#lists.isEmpty(items)}">
    <div class="col-lg-8">
      <article class="cart-item" th:each="item : ${items}">
        <div>
          <h2 class="ci-name" th:text="${item.product.name}">Product name</h2>
          <p class="ci-unit">₹<span th:text="${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 2, 'POINT')}">0.00</span> each</p>
        </div>
        <div class="ci-subtotal">
          ₹<span th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 2, 'POINT')}">0.00</span>
          <small>Subtotal</small>
        </div>

        <div class="ci-actions">
          <form th:action="@{/cart/update/{id}(id=${item.product.id})}" method="post" class="qty-form">
            <label th:for="'qty-' + ${item.product.id}">Qty</label>
            <input type="number" class="form-control" name="quantity" inputmode="numeric"
                   th:id="'qty-' + ${item.product.id}" min="0"
                   th:max="${item.product.stock}" th:value="${item.quantity}">
            <button class="btn btn-outline-primary btn-sm" type="submit">Update</button>
          </form>
          <form th:action="@{/cart/remove/{id}(id=${item.product.id})}" method="post">
            <button class="btn btn-link btn-link-danger" type="submit">Remove</button>
          </form>
        </div>
      </article>

      <a href="/" class="btn btn-outline-secondary mt-3">Continue shopping</a>
    </div>

    <aside class="col-lg-4">
      <div class="summary">
        <h2>Order summary</h2>
        <div class="row-line"><span>Items</span><span th:text="${#lists.size(items)}">1</span></div>
        <div class="total-line">
          <span>Total</span>
          <span>₹<span th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 2, 'POINT')}">0.00</span></span>
        </div>
        <form th:action="@{/checkout}" method="post">
          <button class="btn btn-primary btn-lg w-100" type="submit">Place order</button>
        </form>
      </div>
    </aside>
  </div>
</main>

<footer class="site-footer">Cheetah © 2026 — Online shopping made simple</footer>
</body>
</html>
