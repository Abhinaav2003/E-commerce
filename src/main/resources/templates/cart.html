<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Cart | ShopEase</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div class="container py-5"><h1>Your Shopping Cart</h1>
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<div th:if="${#lists.isEmpty(items)}" class="alert alert-info">Your cart is empty. <a href="/">Continue shopping</a></div>
<div class="table-responsive" th:unless="${#lists.isEmpty(items)}"><table class="table table-bordered align-middle">
<thead><tr><th>Product</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th>Action</th></tr></thead>
<tbody><tr th:each="item : ${items}"><td th:text="${item.product.name}"></td><td th:text="${item.product.price}"></td>
<td><form th:action="@{/cart/update/{id}(id=${item.product.id})}" method="post" class="d-flex gap-2">
<input type="number" class="form-control" name="quantity" min="0" th:max="${item.product.stock}" th:value="${item.quantity}" style="width:90px">
<button class="btn btn-outline-primary">Update</button></form></td><td th:text="${item.subtotal}"></td><td>
<form th:action="@{/cart/remove/{id}(id=${item.product.id})}" method="post"><button class="btn btn-outline-danger">Remove</button></form></td></tr></tbody></table>
<h3 class="text-end">Total: ₹<span th:text="${total}"></span></h3><form th:action="@{/checkout}" method="post" class="text-end"><button class="btn btn-success btn-lg">Place Order</button></form></div>
<a href="/" class="btn btn-outline-secondary mt-3">Continue Shopping</a></div></body></html>
