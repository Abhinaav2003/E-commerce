<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders | Cheetah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root { --ink:#17212b; --paper:#f5f7f8; --card:#fff; --line:#e3e8ec; --muted:#5d6b79; --brand:#0f766e; --brand-dark:#0b5c56; --accent:#ffb703; --danger:#b42318; --radius:14px; }
body { font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--paper); color:var(--ink); min-height:100vh; display:flex; flex-direction:column; }
main { flex:1; }
:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
a { color:var(--brand); }
.site-nav { background:var(--ink); padding-block:.7rem; }
.site-nav .navbar-brand { color:#fff; font-weight:800; font-size:1.35rem; letter-spacing:-.02em; }
.site-nav .navbar-brand span { color:var(--accent); }
.nav-scroll { display:flex; gap:1rem; overflow-x:auto; white-space:nowrap; }
.nav-link-lite { color:#d5dde4; text-decoration:none; font-weight:500; font-size:.95rem; }
.nav-link-lite:hover, .nav-link-lite.active { color:#fff; }
.nav-link-lite.active { border-bottom:2px solid var(--accent); }
.page-title { font-weight:800; letter-spacing:-.02em; font-size:clamp(1.5rem,4.5vw,2rem); margin:0; }
.btn { font-weight:600; border-radius:10px; }
.btn-primary { background:var(--brand); border-color:var(--brand); }
.btn-primary:hover, .btn-primary:focus { background:var(--brand-dark); border-color:var(--brand-dark); }
.btn-outline-primary { color:var(--brand); border-color:var(--brand); }
.btn-outline-primary:hover { background:var(--brand); border-color:var(--brand); }
.panel { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:1.1rem 1.25rem; }
.panel h2 { font-size:1.1rem; font-weight:700; margin:0 0 .9rem; }
.muted { color:var(--muted); }
.empty { color:var(--muted); margin:0; padding:.5rem 0; }
.badge-st { display:inline-block; font-size:.78rem; font-weight:700; padding:.3em .7em; border-radius:999px; background:#e9eef1; color:var(--ink); }
.st-placed { background:#dcf3ef; color:#0b5c56; }
.st-shipped { background:#e0ecff; color:#1d4ed8; }
.st-delivered { background:#dcfce7; color:#166534; }
.st-cancelled { background:#fde4e0; color:var(--danger); }
.site-footer { background:var(--ink); color:#b9c5d0; padding:1.25rem 1rem; font-size:.9rem; text-align:center; }
.order { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:1rem 1.1rem; }
.order + .order { margin-top:.85rem; }
.o-head { display:flex; justify-content:space-between; align-items:flex-start; gap:.75rem; flex-wrap:wrap; }
.o-id { font-weight:700; font-size:1.1rem; margin:0; }
.o-meta { color:var(--muted); font-size:.88rem; margin:.15rem 0 0; overflow-wrap:anywhere; }
.o-items { margin:.8rem 0 0; padding-top:.8rem; border-top:1px solid var(--line); line-height:1.55; overflow-wrap:anywhere; }
.o-foot { display:flex; justify-content:space-between; align-items:center; gap:.75rem; flex-wrap:wrap; margin-top:.8rem; padding-top:.8rem; border-top:1px solid var(--line); }
.o-total { font-weight:800; font-size:1.25rem; }
.status-form { display:flex; gap:.5rem; }
.status-form .form-select { font-size:1rem; border-radius:10px; border-color:#cfd8df; min-width:9.5rem; }
.status-form .form-select:focus { border-color:var(--brand); box-shadow:0 0 0 .2rem rgba(15,118,110,.18); }
@media (max-width:575.98px) { .status-form { width:100%; } .status-form .form-select { flex:1; } }
.empty-state { text-align:center; background:var(--card); border:1px dashed #c8d1d8; border-radius:var(--radius); padding:3rem 1.25rem; }
.logout { background:none; border:0; padding:0; font:inherit; cursor:pointer; }
</style>
</head>
<body>
<nav class="site-nav">
  <div class="container d-flex align-items-center justify-content-between gap-3">
    <a class="navbar-brand" href="/">Chee<span>tah</span></a>
    <div class="nav-scroll">
      <a class="nav-link-lite" href="/admin">Dashboard</a>
      <a class="nav-link-lite" href="/admin/products">Products</a>
      <a class="nav-link-lite active" href="/admin/orders">Orders</a>
      <a class="nav-link-lite" href="/">Shop</a>
      <form th:action="@{/logout}" method="post" class="m-0"><button class="nav-link-lite logout" type="submit">Log out</button></form>
    </div>
  </div>
</nav>

<main class="container py-4 py-md-5" style="max-width:900px">
  <h1 class="page-title mb-3 mb-md-4">Orders
    <span class="muted fw-normal fs-6" th:unless="${#lists.isEmpty(orders)}" th:text="'(' + ${#lists.size(orders)} + ')'"></span>
  </h1>

  <div class="empty-state" th:if="${#lists.isEmpty(orders)}">
    <h2 class="h5 fw-bold">No orders yet</h2>
    <p class="muted mb-0">Customer orders will appear here.</p>
  </div>

  <article class="order" th:each="order : ${orders}">
    <div class="o-head">
      <div>
        <h2 class="o-id">Order #<span th:text="${order.id}">1</span></h2>
        <p class="o-meta"><span th:text="${order.customerEmail}">customer@example.com</span> · <span th:text="${order.createdAt}">Date</span></p>
      </div>
      <span class="badge-st" th:classappend="'st-' + ${#strings.toLowerCase(order.status)}" th:text="${#strings.capitalize(#strings.toLowerCase(order.status))}">Placed</span>
    </div>
    <p class="o-items" th:text="${order.itemsSummary}">Items</p>
    <div class="o-foot">
      <span class="o-total">₹<span th:text="${#numbers.formatDecimal(order.total, 0, 'COMMA', 2, 'POINT')}">0.00</span></span>
      <form class="status-form" th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post">
        <label class="visually-hidden" th:for="'status-' + ${order.id}">Order status</label>
        <select class="form-select" name="status" th:id="'status-' + ${order.id}">
          <option value="PLACED" th:selected="${#strings.toString(order.status) == 'PLACED'}">Placed</option>
          <option value="SHIPPED" th:selected="${#strings.toString(order.status) == 'SHIPPED'}">Shipped</option>
          <option value="DELIVERED" th:selected="${#strings.toString(order.status) == 'DELIVERED'}">Delivered</option>
          <option value="CANCELLED" th:selected="${#strings.toString(order.status) == 'CANCELLED'}">Cancelled</option>
        </select>
        <button class="btn btn-primary" type="submit">Update</button>
      </form>
    </div>
  </article>
</main>

<footer class="site-footer">Cheetah © 2026 — Online shopping made simple</footer>
</body>
</html>
