<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard | Simple Shop</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header class="topbar"><a class="brand" th:href="@{/admin/dashboard}">Simple Shop <span>Admin</span></a>
<form th:action="@{/logout}" method="post"><button class="btn outline" type="submit">Logout</button></form></header>
<main class="container">
    <div class="page-heading"><div><p class="eyebrow">ADMIN PANEL</p><h1>Dashboard</h1><p class="muted">Manage products and review customer orders.</p></div></div>
    <div class="alert success" th:if="${message}" th:text="${message}"></div>
    <section class="panel">
        <h2>Add a product</h2>
        <form th:action="@{/admin/products}" th:object="${product}" method="post" class="product-form">
            <div><label>Product name</label><input th:field="*{name}" required maxlength="120"><small class="field-error" th:errors="*{name}"></small></div>
            <div><label>Price (₹)</label><input th:field="*{price}" type="number" min="0.01" step="0.01" required><small class="field-error" th:errors="*{price}"></small></div>
            <div><label>Stock quantity</label><input th:field="*{quantity}" type="number" min="0" required><small class="field-error" th:errors="*{quantity}"></small></div>
            <div class="wide"><label>Description</label><textarea th:field="*{description}" rows="2" maxlength="500" placeholder="Short product description"></textarea></div>
            <div class="wide"><button class="btn primary" type="submit">+ Add product</button></div>
        </form>
    </section>
    <section class="panel">
        <div class="section-title"><h2>Products</h2><span class="count" th:text="${products.size()} + ' products'"></span></div>
        <div class="table-wrap"><table><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead>
        <tbody><tr th:each="p : ${products}"><td><strong th:text="${p.name}"></strong><small class="table-description" th:text="${p.description}"></small></td>
        <td th:text="'₹' + ${#numbers.formatDecimal(p.price, 1, 2)}"></td><td><span class="stock" th:text="${p.quantity}"></span></td>
        <td><form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post" onsubmit="return confirm('Delete this product?')"><button class="btn danger small" type="submit">Delete</button></form></td></tr>
        <tr th:if="${#lists.isEmpty(products)}"><td colspan="4" class="empty">No products yet. Add your first product above.</td></tr></tbody></table></div>
    </section>
    <section class="panel">
        <div class="section-title"><h2>Customer orders</h2><span class="count" th:text="${orders.size()} + ' orders'"></span></div>
        <div class="table-wrap"><table><thead><tr><th>Order #</th><th>Customer</th><th>Product</th><th>Qty</th><th>Total</th><th>Date</th><th>Status</th></tr></thead>
        <tbody><tr th:each="o : ${orders}"><td th:text="${o.id}"></td><td th:text="${o.customerUsername}"></td><td th:text="${o.productName}"></td><td th:text="${o.quantity}"></td><td th:text="'₹' + ${#numbers.formatDecimal(o.totalAmount, 1, 2)}"></td><td th:text="${#temporals.format(o.orderDate, 'dd MMM yyyy HH:mm')}"></td><td><span class="status" th:text="${o.status}"></span></td></tr>
        <tr th:if="${#lists.isEmpty(orders)}"><td colspan="7" class="empty">No orders have been placed yet.</td></tr></tbody></table></div>
    </section>
</main>
</body></html>
