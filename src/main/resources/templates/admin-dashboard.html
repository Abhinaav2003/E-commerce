<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | Cheetah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root { --ink:#17212b; --paper:#f5f7f8; --card:#fff; --line:#e3e8ec; --muted:#5d6b79; --brand:#0f766e; --brand-dark:#0b5c56; --accent:#ffb703; --danger:#b42318; --radius:14px; }
body { font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--paper); color:var(--ink); min-height:100vh; display:flex; flex-direction:column; }
main { flex:1; }
:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
a { color:var(--brand); }
.site-nav { background:var(--ink); padding-block:.7rem; }
.site-nav .navbar-brand { color:#fff; font-weight:800; font-size:1.35rem; letter-spacing:-.02em; }
.site-nav .navbar-brand span { color:var(--accent); }
.nav-scroll { display:flex; gap:1rem; overflow-x:auto; white-space:nowrap; }
.nav-link-lite { color:#d5dde4; text-decoration:none; font-weight:500; font-size:.95rem; }
.nav-link-lite:hover, .nav-link-lite.active { color:#fff; }
.nav-link-lite.active { border-bottom:2px solid var(--accent); }
.page-title { font-weight:800; letter-spacing:-.02em; font-size:clamp(1.5rem,4.5vw,2rem); margin:0; }
.btn { font-weight:600; border-radius:10px; }
.btn-primary { background:var(--brand); border-color:var(--brand); }
.btn-primary:hover, .btn-primary:focus { background:var(--brand-dark); border-color:var(--brand-dark); }
.btn-outline-primary { color:var(--brand); border-color:var(--brand); }
.btn-outline-primary:hover { background:var(--brand); border-color:var(--brand); }
.panel { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:1.1rem 1.25rem; }
.panel h2 { font-size:1.1rem; font-weight:700; margin:0 0 .9rem; }
.muted { color:var(--muted); }
.empty { color:var(--muted); margin:0; padding:.5rem 0; }
.badge-st { display:inline-block; font-size:.78rem; font-weight:700; padding:.3em .7em; border-radius:999px; background:#e9eef1; color:var(--ink); }
.st-placed { background:#dcf3ef; color:#0b5c56; }
.st-shipped { background:#e0ecff; color:#1d4ed8; }
.st-delivered { background:#dcfce7; color:#166534; }
.st-cancelled { background:#fde4e0; color:var(--danger); }
.site-footer { background:var(--ink); color:#b9c5d0; padding:1.25rem 1rem; font-size:.9rem; text-align:center; }
.stats { display:grid; grid-template-columns:repeat(2,1fr); gap:.85rem; }
@media (min-width:992px) { .stats { grid-template-columns:repeat(4,1fr); } }
.stat { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:1rem 1.1rem; }
.stat .lbl { color:var(--muted); font-size:.85rem; font-weight:500; }
.stat .val { font-size:clamp(1.4rem,4vw,1.9rem); font-weight:800; letter-spacing:-.02em; line-height:1.2; margin-top:.2rem; }
.stat.warn .val { color:#b45309; }
.list-row { display:flex; justify-content:space-between; align-items:center; gap:.75rem; padding:.7rem 0; border-top:1px solid var(--line); }
.list-row:first-of-type { border-top:0; }
.list-row .t { font-weight:600; }
.list-row .s { color:var(--muted); font-size:.85rem; }
.right { text-align:right; white-space:nowrap; }
.logout { background:none; border:0; padding:0; font:inherit; cursor:pointer; }
</style>
</head>
<body>
<nav class="site-nav">
  <div class="container d-flex align-items-center justify-content-between gap-3">
    <a class="navbar-brand" href="/">Chee<span>tah</span></a>
    <div class="nav-scroll">
      <a class="nav-link-lite active" href="/admin">Dashboard</a>
      <a class="nav-link-lite" href="/admin/products">Products</a>
      <a class="nav-link-lite" href="/admin/orders">Orders</a>
      <a class="nav-link-lite" href="/">Shop</a>
      <form th:action="@{/logout}" method="post" class="m-0"><button class="nav-link-lite logout" type="submit">Log out</button></form>
    </div>
  </div>
</nav>

<main class="container py-4 py-md-5">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3 mb-md-4">
    <h1 class="page-title">Dashboard</h1>
    <div class="d-flex gap-2">
      <a class="btn btn-primary" href="/admin/products/new">Add product</a>
      <a class="btn btn-outline-primary" href="/admin/orders">Manage orders</a>
    </div>
  </div>

  <section class="stats mb-4" aria-label="Store summary">
    <div class="stat"><div class="lbl">Products</div><div class="val" th:text="${productCount}">0</div></div>
    <div class="stat"><div class="lbl">Orders</div><div class="val" th:text="${orderCount}">0</div></div>
    <div class="stat"><div class="lbl">Revenue</div><div class="val">₹<span th:text="${#numbers.formatDecimal(revenue, 0, 'COMMA', 2, 'POINT')}">0.00</span></div></div>
    <div class="stat warn"><div class="lbl">Low stock</div><div class="val" th:text="${lowStockCount}">0</div></div>
  </section>

  <div class="row g-3 g-md-4">
    <div class="col-lg-6">
      <section class="panel h-100">
        <h2>Low stock</h2>
        <p class="empty" th:if="${#lists.isEmpty(lowStockProducts)}">Everything is well stocked.</p>
        <div class="list-row" th:each="p : ${lowStockProducts}">
          <div><div class="t" th:text="${p.name}">Product</div>
               <div class="s" th:text="${p.stock == 0} ? 'Out of stock' : ${p.stock} + ' left'">3 left</div></div>
          <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/products/{id}/edit(id=${p.id})}">Restock</a>
        </div>
      </section>
    </div>
    <div class="col-lg-6">
      <section class="panel h-100">
        <h2>Recent orders</h2>
        <p class="empty" th:if="${#lists.isEmpty(recentOrders)}">No orders yet.</p>
        <div class="list-row" th:each="o : ${recentOrders}">
          <div><div class="t">Order #<span th:text="${o.id}">1</span></div>
               <div class="s" th:text="${o.createdAt}">Date</div></div>
          <div class="right">
            <div class="t">₹<span th:text="${#numbers.formatDecimal(o.total, 0, 'COMMA', 2, 'POINT')}">0.00</span></div>
            <span class="badge-st" th:classappend="'st-' + ${#strings.toLowerCase(o.status)}" th:text="${#strings.capitalize(#strings.toLowerCase(o.status))}">Placed</span>
          </div>
        </div>
      </section>
    </div>
  </div>
</main>

<footer class="site-footer">Cheetah © 2026 — Online shopping made simple</footer>
</body>
</html>
