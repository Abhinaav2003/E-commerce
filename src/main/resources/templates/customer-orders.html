<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Orders | Simple Shop</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header class="topbar"><a class="brand" th:href="@{/customer/products}">Simple Shop <span>Store</span></a>
<nav class="nav-links"><a th:href="@{/customer/products}">Products</a><a th:href="@{/customer/orders}">My orders</a></nav>
<form th:action="@{/logout}" method="post"><button class="btn outline" type="submit">Logout</button></form></header>
<main class="container">
    <div class="page-heading"><div><p class="eyebrow">ORDER HISTORY</p><h1>My orders</h1><p class="muted">Review orders placed using your account.</p></div><a class="btn primary" th:href="@{/customer/products}">Browse products</a></div>
    <div class="alert success" th:if="${message}" th:text="${message}"></div>
    <section class="panel"><div class="table-wrap"><table><thead><tr><th>Order #</th><th>Product</th><th>Qty</th><th>Unit price</th><th>Total</th><th>Order date</th><th>Status</th></tr></thead>
    <tbody><tr th:each="o : ${orders}"><td th:text="${o.id}"></td><td th:text="${o.productName}"></td><td th:text="${o.quantity}"></td><td th:text="'₹' + ${#numbers.formatDecimal(o.unitPrice, 1, 2)}"></td><td><strong th:text="'₹' + ${#numbers.formatDecimal(o.totalAmount, 1, 2)}"></strong></td><td th:text="${#temporals.format(o.orderDate, 'dd MMM yyyy HH:mm')}"></td><td><span class="status" th:text="${o.status}"></span></td></tr>
    <tr th:if="${#lists.isEmpty(orders)}"><td colspan="7" class="empty">You haven't placed any orders yet.</td></tr></tbody></table></div></section>
</main>
</body></html>
