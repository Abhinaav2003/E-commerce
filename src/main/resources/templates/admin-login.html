<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin login | Cheetah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root {
  --ink: #17212b;
  --ink-2: #22303d;
  --paper: #f5f7f8;
  --line: #e3e8ec;
  --muted: #5d6b79;
  --brand: #0f766e;
  --brand-dark: #0b5c56;
  --accent: #ffb703;
}
body.auth-page {
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--ink);
  color: var(--ink);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.25rem;
}
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.auth-brand {
  color: #fff; font-weight: 800; font-size: 1.6rem;
  letter-spacing: -.02em; text-decoration: none; margin-bottom: 1.25rem;
}
.auth-brand span { color: var(--accent); }

.auth-card {
  width: 100%; max-width: 420px;
  background: #fff; border: 0; border-radius: 16px;
  padding: 1.5rem;
  box-shadow: 0 20px 50px rgba(0,0,0,.3);
}
@media (min-width: 576px) { .auth-card { padding: 2.25rem; } }

.auth-card h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: .25rem; }
.auth-card .sub { color: var(--muted); margin-bottom: 1.5rem; }

.form-label { font-weight: 600; font-size: .9rem; margin-bottom: .35rem; }
.form-control {
  font-size: 1rem; /* 16px stops iOS zoom on focus */
  padding: .7rem .85rem; border-radius: 10px; border-color: #cfd8df;
}
.form-control:focus { border-color: var(--brand); box-shadow: 0 0 0 .2rem rgba(15,118,110,.18); }

.pw-wrap { position: relative; }
.pw-wrap .form-control { padding-right: 4.5rem; }
.pw-toggle {
  position: absolute; top: 50%; right: .4rem; transform: translateY(-50%);
  border: 0; background: none; color: var(--brand); font-weight: 600;
  font-size: .85rem; padding: .4rem .6rem; border-radius: 8px;
}
.pw-toggle:hover { background: #eef5f4; }

.btn-primary {
  background: var(--brand); border-color: var(--brand);
  font-weight: 700; padding: .75rem; border-radius: 10px;
}
.btn-primary:hover, .btn-primary:focus { background: var(--brand-dark); border-color: var(--brand-dark); }

.alert { border-radius: 10px; font-size: .92rem; padding: .7rem .9rem; }
.auth-card a { color: var(--brand); font-weight: 600; }
.back-link { color: #b9c5d0; margin-top: 1.25rem; font-size: .92rem; text-decoration: none; }
.back-link:hover { color: #fff; }
</style>
</head>
<body class="auth-page">

<a class="auth-brand" href="/">Chee<span>tah</span></a>

<main class="card auth-card">
  <h1>Admin login</h1>
  <p class="sub">Enter the admin password to manage products and orders.</p>

  <div class="alert alert-danger" role="alert" th:if="${param.error}">Incorrect password.</div>
  <div class="alert alert-warning" role="alert" th:if="${param.locked}">Too many attempts. Please try again in 5 minutes.</div>
  <div class="alert alert-success" role="status" th:if="${param.logout}">You have logged out.</div>

  <form th:action="@{/admin/login}" method="post">
    <div class="mb-4">
      <label class="form-label" for="password">Password</label>
      <div class="pw-wrap">
        <input class="form-control" id="password" type="password" name="password"
               required autofocus autocomplete="current-password" placeholder="Admin password">
        <button class="pw-toggle" type="button" id="pwToggle" aria-controls="password" aria-pressed="false">Show</button>
      </div>
    </div>
    <button class="btn btn-primary w-100" type="submit">Enter</button>
  </form>

  <p class="mt-4 mb-0 text-center small"><a href="/login">Customer login</a></p>
</main>

<a class="back-link" href="/">Back to shop</a>

<script>
  const pw = document.getElementById('password');
  const btn = document.getElementById('pwToggle');
  btn.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    btn.textContent = show ? 'Hide' : 'Show';
    btn.setAttribute('aria-pressed', show);
  });
</script>
</body>
</html>
