<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Simple Shop</title><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <div class="brand-mark">S</div>
    <h1>Simple Shop</h1><p class="muted">Sign in to continue</p>
    <div class="alert success" th:if="${param.registered}">Registration successful. Please log in.</div>
    <div class="alert" th:if="${param.error}">Invalid username or password.</div>
    <div class="alert success" th:if="${param.logout}">You have logged out.</div>
    <form th:action="@{/login}" method="post">
        <label>Username</label><input type="text" name="username" required autofocus>
        <label>Password</label><input type="password" name="password" required>
        <button class="btn primary full" type="submit">Login</button>
    </form>
    <p class="muted center">New customer? <a th:href="@{/register}">Create an account</a></p>
    <div class="demo-box"><strong>Demo admin login</strong><br>Username: <code>admin</code><br>Password: <code>admin123</code></div>
</main>
</body></html>
