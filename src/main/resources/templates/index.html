<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopEase | Online Store</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container">
<a class="navbar-brand fw-bold" href="/">ShopEase</a>
<div class="d-flex flex-wrap gap-2 align-items-center">
<a class="btn btn-outline-light" href="/cart">Cart</a><a class="btn btn-outline-light" href="/orders">My Orders</a>
<a class="btn btn-warning" href="/login">Login</a><a class="btn btn-outline-warning" href="/register">Register</a>
<form th:action="@{/logout}" method="post"><button class="btn btn-danger">Logout</button></form>
<a class="btn btn-outline-info" href="/admin/products">Admin</a>
</div></div></nav>
<header class="hero text-center text-white py-5"><div class="container">
<h1 class="display-5 fw-bold">Find Your Everyday Essentials</h1><p>Quality products. Simple shopping.</p>
<form method="get" action="/" class="d-flex mx-auto search-form">
<input class="form-control" name="search" th:value="${search}" placeholder="Search products...">
<button class="btn btn-warning ms-2">Search</button></form></div></header>
<main class="container py-5"><h2 class="mb-4">Our Products</h2><div class="row g-4">
<div class="col-12 col-sm-6 col-lg-4" th:each="product : ${products}">
<div class="card product-card h-100 shadow-sm"><img class="card-img-top product-image" th:src="${product.imageUrl}" th:alt="${product.name}">
<div class="card-body d-flex flex-column"><h5 th:text="${product.name}"></h5><p class="text-secondary" th:text="${product.description}"></p>
<h4 class="text-primary mt-auto">₹<span th:text="${product.price}"></span></h4>
<p>Stock: <span th:text="${product.stock}"></span></p>
<form th:action="@{/cart/add/{id}(id=${product.id})}" method="post"><button class="btn btn-primary w-100" th:disabled="${product.stock == 0}">Add to Cart</button></form>
</div></div></div>
<div class="col-12" th:if="${#lists.isEmpty(products)}"><p>No products found.</p></div>
</div></main><footer class="bg-dark text-white text-center p-3">ShopEase © 2026 — Online Shopping Made Simple</footer>
</body></html>
