<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products | Simple Shop</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header class="topbar"><a class="brand" th:href="@{/customer/products}">Simple Shop <span>Store</span></a>
<nav class="nav-links"><a th:href="@{/customer/products}">Products</a><a th:href="@{/customer/orders}">My orders</a></nav>
<form th:action="@{/logout}" method="post"><button class="btn outline" type="submit">Logout</button></form></header>
<main class="container">
    <div class="page-heading"><div><p class="eyebrow">CUSTOMER STORE</p><h1>Available products</h1><p class="muted">Choose a product and place your order. No product images required.</p></div></div>
    <div class="alert success" th:if="${message}" th:text="${message}"></div><div class="alert" th:if="${error}" th:text="${error}"></div>
    <div class="product-grid">
        <article class="product-card" th:each="p : ${products}">
            <div class="product-icon"><span>▦</span></div>
            <div class="product-content"><span class="product-tag">PRODUCT</span><h2 th:text="${p.name}"></h2>
                <p class="description" th:text="${p.description != null and !p.description.isBlank() ? p.description : 'Quality product available to order.'}"></p>
                <div class="product-bottom"><div><strong class="price" th:text="'₹' + ${#numbers.formatDecimal(p.price, 1, 2)}"></strong><small class="muted" th:text="${p.quantity} + ' in stock'"></small></div></div>
                <form th:if="${p.quantity > 0}" th:action="@{/customer/order/{id}(id=${p.id})}" method="post" class="order-form">
                    <label th:for="${'qty-' + p.id}">Quantity</label><input th:id="${'qty-' + p.id}" type="number" name="quantity" min="1" th:max="${p.quantity}" value="1" required>
                    <button class="btn primary full" type="submit">Order now</button>
                </form>
                <button th:if="${p.quantity == 0}" class="btn disabled full" disabled>Out of stock</button>
            </div>
        </article>
        <div class="empty-card" th:if="${#lists.isEmpty(products)}">No products are available right now.</div>
    </div>
</main>
</body></html>
