<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Orders | ShopEase</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div class="container py-5"><h1 class="mb-4">My Orders</h1>
<div th:if="${#lists.isEmpty(orders)}" class="alert alert-info">You haven't placed any orders yet. <a href="/">Start shopping</a></div>
<div class="card shadow-sm mb-3" th:each="order : ${orders}"><div class="card-body"><h5>Order #<span th:text="${order.id}"></span></h5>
<p><strong>Date:</strong> <span th:text="${order.createdAt}"></span></p><p><strong>Items:</strong> <span th:text="${order.itemsSummary}"></span></p>
<h5>Total: ₹<span th:text="${order.total}"></span></h5><span class="badge text-bg-success">Placed</span></div></div>
<a href="/" class="btn btn-primary">Continue Shopping</a></div></body></html>
